          (t.note ? '<div class="thread" style="margin-top:4px"><span class="who you caps">You</span> <q class="said">' + esc(t.note) + '</q></div>' : '') + '</li>';
      }).join("") + '</ul></details>' : '';
    return '<div class="split"><section class="sheet pad"><div class="block" style="margin-top:0"><h3><span class="caps">Open</span><span class="muted" style="font-size:14px">' + open.length +
      (D.todo_sync ? ' · mirrored to GitHub' : '') + '</span></h3>' + openList +
      (open.length ? '<p class="lcnote">Tick what you have finished; margi records it under your name.</p>' : '') + '</div>' + doneList + respondBar() + '</section>' +
      (waitList ? '<section class="sheet pad"><div class="block" style="margin-top:0"><h3><span class="caps">Waiting for your review</span><span class="muted" style="font-size:14px">' + waiting.length + '</span></h3>' + waitList + '</div></section>' : '<div></div>') + '</div>';
  }

  var RUN_LINK = { read: "literature", todos: "todos", "submit-check": "submission", defend: "submission", outline: "timeline", propose: "docs", challenge: "docs" };
  function runLink(r) {
    var label = esc(r.scope);
    if ((r.command === "grade" || r.command === "respond") && sections.some(function (x) { return x.id === r.scope; })) {
      return '<a href="#tab=sections&s=' + encodeURIComponent(r.scope) + '" data-goto="' + esc(r.scope) + '">' + label + '</a>';
    }
    var tab = RUN_LINK[r.command];
    return tab ? '<a href="#tab=' + tab + '" data-tabgo="' + tab + '">' + label + '</a>' : label;
  }
  function runsView() {
    if (!D.runs.length) return '<div class="sheet empty"><h3 aria-level="2">No runs yet</h3><p>Every margi command leaves a provenance-stamped record in <code>margi/feedback/</code>. They will be listed here.</p></div>';
    var cmds = [];
    D.runs.forEach(function (r) { if (cmds.indexOf(r.command) < 0) cmds.push(r.command); });
    if (state.runcmd && cmds.indexOf(state.runcmd) < 0) state.runcmd = null;
    var shown = D.runs.filter(function (r) { return !state.runcmd || r.command === state.runcmd; });
    var filter = cmds.length > 1 ? '<div class="tablebar"><label><span class="visually-hidden">Command</span><select id="runcmd"><option value="">All commands</option>' +
      cmds.map(function (c) { return '<option value="' + esc(c) + '"' + (state.runcmd === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join("") + '</select></label>' +
      '<span>' + plural(shown.length, "run") + '</span></div>' : '';
    return '<div class="sheet">' + filter + '<table class="plain"><thead><tr><th class="caps">When</th><th class="caps">Command</th><th class="caps">Scope</th><th class="caps hide-s">Model</th><th class="caps hide-s">Summary</th></tr></thead><tbody>' +
      shown.map(function (r) {
        return '<tr title="' + esc(r.file) + '"><td style="white-space:nowrap">' + fmtDate(r.timestamp, true) + '</td><td>' + esc(r.command) + '</td><td>' + runLink(r) + '</td><td class="hide-s muted">' + esc(r.model || "—") + '</td><td class="why hide-s">' + esc(r.summary) + '</td></tr>';
      }).join("") + '</tbody></table></div>' +
      '<p class="muted" style="font-size:15px">Each run is a record in <code>margi/feedback/</code> (hover a row for its file). The full audit trail is <code>git log -- margi/</code>.</p>';
  }

  // ------------------------------------------------------------------ guide tab
  var COMMANDS = [
    ["/margi propose", "Turns your PROPOSAL.md into sourced project docs and lists open questions.", true],
    ["/margi challenge <aspect>", "A devil's-advocate dialogue about one aspect; confirmed refinements go into the docs.", true],
    ["/margi grade <section>", "Rubric scores and comments anchored to your text, judged against your docs.", true],
    ["/margi respond <c17 …>", "Your answer to comments: addressed, disputed or won't fix, in your own words.", false],
    ["/margi read [pdf …]", "Rates literature PDFs for relevance and traces key passages into the PDF.", true],
    ["/margi todos", "Proposes todos and closures for you to accept; /margi todos done <id> marks yours done.", true],
    ["/margi outline", "Counts the length of every section against your targets.", false],
    ["/margi status", "Plain-text overview of grades, comments, length and recent runs; also updates this page (reload it).", false],
    ["/margi help", "Checks what is there and what is missing, and suggests what to run next. Also just /margi.", true],
    ["/margi submit-check", "Before submission: quotations against PDFs, bibliography, length, what is still open.", false],
    ["/margi ai-report", "A factual appendix of every margi run and the separation check.", false],
    ["/margi defend [chapter]", "Examiner questions over the finished thesis; margi only asks.", true]
  ];
  var codeTicks = function (t) { return esc(t).replace(/`([^`]+)`/g, "<code>$1</code>"); };
  function guideView() {
    var cmds = '<section class="sheet" style="min-width:0;overflow-x:auto"><table class="plain" aria-label="Commands"><thead><tr><th class="caps">Command</th><th class="caps">What it does</th><th class="caps">AI</th></tr></thead><tbody>' +
      COMMANDS.map(function (c) {
        var bare = c[0].replace(/\s*[<\[].*$/, "");
        if (bare === "/margi grade") {
          var g1 = (D.next_steps || []).filter(function (x) { return /^\/margi grade \S/.test(x.command); })[0];
          var s1 = D.sections.filter(function (x) { return !x.orphan && x.chars > 0; })[0];
          var cmd = g1 ? g1.command : s1 ? "/margi grade " + s1.id : null;
          if (cmd) return '<tr><td>' + cmdChip(cmd) + '<div class="muted mono" style="font-size:12px;margin-top:2px">or any &lt;section&gt; id</div></td><td class="why">' + esc(c[1]) + '</td><td class="muted">yes</td></tr>';
        }
        return '<tr><td>' + cmdChip(bare) + (bare !== c[0] ? '<div class="muted mono" style="font-size:12px;margin-top:2px">' + esc(c[0].slice(bare.length).trim()) + '</div>' : '') + '</td><td class="why">' + esc(c[1]) + '</td><td class="muted">' + (c[2] ? 'yes' : 'no') + '</td></tr>';
      }).join("") + '</tbody></table><p class="tlnote" style="padding-top:12px">Run them in Claude Code. margi writes only inside <code>margi/</code> and never writes thesis text.</p></section>';
    var anchors = rub.anchors || {}, keys = Object.keys(anchors).sort();
    var scale = '<div class="block" style="margin-top:0"><h3><span class="caps">The scale</span><span class="muted" style="font-size:14px">' + esc(rub.title || rub.id) + '</span></h3><ul class="list">' +
      keys.map(function (k) { return '<li><b>' + esc(k) + '</b> ' + esc(anchors[k]) + '</li>'; }).join("") + '</ul>' +
      '<p class="lcnote">Scores of ' + Math.floor(lowCut) + ' or below are marked in <span class="red">red</span>. A grade is judged against what your project docs say the thesis is trying to do; while the docs are incomplete it is marked low-confidence (in italics).' + (rub.notes ? ' ' + codeTicks(rub.notes) : '') + '</p></div>';
    var cats = '<div class="block"><h3><span class="caps">Categories</span><span class="muted" style="font-size:14px">' + rub.categories.length + '</span></h3><dl class="doclist guidecats">' +
      rub.categories.map(function (c) {
        var lv = c.levels || {};
        return '<dt><b>' + esc(abbr(c.id)) + '</b> ' + esc(c.title) + '</dt><dd>' + (c.question ? '<p style="margin:2px 0 4px">' + codeTicks(c.question) + '</p>' : '') +
          Object.keys(lv).sort().reverse().map(function (k) { return '<div class="why"><b>' + esc(k) + '</b> ' + codeTicks(lv[k]) + '</div>'; }).join("") + '</dd>';
      }).join("") + '</dl></div>';
    return '<div class="cols">' + cmds + '<section class="sheet pad">' + scale + cats + '</section></div>';
  }

  // ------------------------------------------------------------------ render + events
  function render(opts) {
    renderTabs();
    var v = $("view");
    var views = { guide: guideView, sections: sectionsView, timeline: timelineView, submission: submissionView, docs: docsView, literature: literatureView, todos: todosView, runs: runsView };
    if (!views[state.tab]) state.tab = "sections";
    v.setAttribute("aria-labelledby", "tab-" + state.tab);
    v.innerHTML = views[state.tab]();
    if (opts && opts.enter) { var a = $("apparatus"); if (a) { a.classList.add("enter"); } }
    var tw = $("tlwrap"), tl = tw && tw.querySelector(".tlchart");
    if (tl && tw.scrollWidth > tw.clientWidth) { // a narrow screen opens the chart at today
      var t = tl.querySelector("[data-today]");
      if (t) tw.scrollLeft = Number(t.getAttribute("x1")) - tw.clientWidth * 0.6;
    }
    writeHash(opts && opts.push);
  }
  function select(sid, focusPanel) {
    var moved = state.sel !== sid;
    if (moved) { state.run = null; state.sev = "all"; state.cat = "all"; state.pick = []; state.closedOpen = false; }
    state.sel = sid; state.tab = "sections";
    render({ enter: true, push: moved && focusPanel });
    var a = $("apparatus");
    if (a) a.scrollTop = 0;
    if (focusPanel && a && window.matchMedia("(max-width: 1080px)").matches) a.scrollIntoView({ block: "start" });
  }

  function selectPaper(pdf, focusPanel) {
    var moved = state.paper !== pdf;
    state.paper = pdf; state.tab = "literature";
    render({ enter: true, push: moved && focusPanel });
    var a = $("apparatus");
    if (a) a.scrollTop = 0;
    if (focusPanel && a && window.matchMedia("(max-width: 1080px)").matches) a.scrollIntoView({ block: "start" });
  }

  $("view").addEventListener("click", function (e) {
    if (e.target.closest("[data-overview]")) { e.preventDefault(); state.sel = null; render({ push: true }); return; }
    var go = e.target.closest("[data-goto]");
    if (go) { e.preventDefault(); select(go.getAttribute("data-goto"), true); return; }
    var ref = e.target.closest("[data-ref]");
    if (ref) { e.preventDefault(); showEntry(ref.getAttribute("data-ref")); return; }
    if (e.target.closest("[data-unpick]")) { state[state.tab === "todos" ? "tpick" : "pick"] = []; updatePicks(); return; }
    if (e.target.closest("[data-pick], .pick")) return;
    var sev = e.target.closest("[data-sev]");
    if (sev) { state.sev = sev.getAttribute("data-sev"); rerenderPanel(); return; }
    var show = e.target.closest("[data-show]");
    if (show) { state.show = show.getAttribute("data-show"); render(); var nb = document.querySelector('[data-show="' + state.show + '"]'); if (nb) nb.focus(); return; }
    if (e.target.closest("[data-copy]") || e.target.closest("a, select, summary")) return;
    var pg = e.target.closest("[data-paper]");
    if (pg) { e.preventDefault(); selectPaper(pg.getAttribute("data-paper"), true); return; }
    var ptr = e.target.closest("tr[data-pdf]");
    if (ptr) { selectPaper(ptr.getAttribute("data-pdf"), true); var pb = document.querySelector('.ptitle[data-pdf="' + CSS.escape(state.paper) + '"]'); if (pb) pb.focus({ preventScroll: true }); return; }
    var tr = e.target.closest("tr[data-sid]");
    if (tr) { select(tr.getAttribute("data-sid"), true); var b = document.querySelector('.stitle[data-sid="' + CSS.escape(state.sel) + '"]'); if (b) b.focus({ preventScroll: true }); }
  });
  $("view").addEventListener("change", function (e) {
    var pk = e.target.getAttribute && e.target.getAttribute("data-pick");
    if (pk) {
      var key = state.tab === "todos" ? "tpick" : "pick";
      state[key] = state[key].filter(function (r) { return r !== pk; });
      if (e.target.checked) state[key].push(pk);
      updatePicks(); return;
    }
    if (e.target.id === "catsel") { state.cat = e.target.value; rerenderPanel(); }
    if (e.target.id === "runsel") { state.run = Number(e.target.value); rerenderPanel(); }
    if (e.target.id === "runcmd") { state.runcmd = e.target.value || null; render(); var rc = $("runcmd"); if (rc) rc.focus(); }
  });
  $("view").addEventListener("keydown", function (e) {
    var pb = e.target.closest(".ptitle");
    if (pb && (e.key === "ArrowDown" || e.key === "ArrowUp")) {
      e.preventDefault();
      var ps = Array.prototype.slice.call(document.querySelectorAll(".ptitle"));
      var j = ps.indexOf(pb) + (e.key === "ArrowDown" ? 1 : -1);
      if (j < 0 || j >= ps.length) return;
      selectPaper(ps[j].getAttribute("data-pdf"));
      var np = document.querySelector('.ptitle[data-pdf="' + CSS.escape(state.paper) + '"]');
      if (np) np.focus();
      return;
    }
    var b = e.target.closest(".stitle");
    if (!b || (e.key !== "ArrowDown" && e.key !== "ArrowUp")) return;
    e.preventDefault();
    var all = Array.prototype.slice.call(document.querySelectorAll(".stitle"));
    var i = all.indexOf(b) + (e.key === "ArrowDown" ? 1 : -1);
    if (i < 0 || i >= all.length) return;
    select(all[i].getAttribute("data-sid"));
    var nb = document.querySelector('.stitle[data-sid="' + CSS.escape(state.sel) + '"]');
    if (nb) { nb.focus(); }
  });
  $("view").addEventListener("pointermove", function (e) {
    var wrap = e.target.closest(".tlwrap");
    if (wrap) {
      var tt = wrap.querySelector(".tip"), h = e.target.closest(".hit");
      if (!h) { tt.classList.remove("on"); return; }
      tt.textContent = h.getAttribute("data-tip");
      tt.style.left = (Number(h.getAttribute("data-x")) + 16) + "px"; // the chart sits inside the wrap's 16px padding
      tt.style.top = (Number(h.getAttribute("data-y")) + 16) + "px";
      tt.classList.add("on");
      return;
    }
    var hit = e.target.closest(".hit");
    document.querySelectorAll(".mult .tip.on").forEach(function (t) { if (!hit || t.parentNode !== hit.closest(".mult")) t.classList.remove("on"); });
    if (!hit) return;
    var fig = hit.closest(".mult"), tip = fig.querySelector(".tip"), svg = fig.querySelector("svg");
    tip.textContent = hit.getAttribute("data-tip");
    tip.style.left = hit.getAttribute("data-x") + "%";
    tip.style.top = (svg.offsetTop + Number(hit.getAttribute("data-y")) / 72 * svg.clientHeight) + "px";
    tip.classList.add("on");
  });
  $("view").addEventListener("toggle", function (e) {
    if (e.target.id === "closed") state.closedOpen = e.target.open;
    if (e.target.id === "tdone") state.todoDoneOpen = e.target.open;
  }, true);
  function rerenderPanel() {
    var a = $("apparatus"); if (!a) return;
    // keep keyboard focus on the control that triggered the re-render
    var f = document.activeElement, key = null;
    if (f && a.contains(f)) key = f.id ? "#" + f.id : f.getAttribute("data-sev") ? '[data-sev="' + f.getAttribute("data-sev") + '"]' : null;
    var y = a.scrollTop; a.classList.remove("enter"); a.innerHTML = apparatus(); a.scrollTop = y;
    var nf = key && a.querySelector(key); if (nf) nf.focus({ preventScroll: true });
  }
  function showEntry(id) {
    var a = $("apparatus"); if (!a) return;
    var el = $(id);
    if (!el) { state.sev = "all"; state.cat = "all"; state.closedOpen = true; rerenderPanel(); el = $(id); }
    var box = el && el.closest("details.closed"); if (box && !box.open) { box.open = true; state.closedOpen = true; }
    if (!el) return;
    el.setAttribute("tabindex", "-1"); el.classList.add("hl");
    el.scrollIntoView({ block: "nearest" }); el.focus({ preventScroll: true });
    setTimeout(function () { el.classList.remove("hl"); }, 1600);
  }
  function onHash() {
    var before = state.sel + "|" + state.paper + "|" + state.tab; readHash();
    if (before !== state.sel + "|" + state.paper + "|" + state.tab) render({ enter: true });
  }
  window.addEventListener("hashchange", onHash);
  window.addEventListener("popstate", onHash);
  // the running head wraps on small screens; sticky offsets need its real height
  function measureHead() { document.documentElement.style.setProperty("--head-real", ($("head").offsetHeight + 4) + "px"); }
  window.addEventListener("resize", measureHead);
  var lastW = 0;
  window.addEventListener("resize", function () {
    var w = $("view").clientWidth;
    if (state.tab === "timeline" && Math.abs(w - lastW) > 40) { lastW = w; render(); }
  });

  readHash();
  renderHead();
  renderStatus();
  renderStrip();
  render();
  measureHead();
})();
</script>
</body>
</html>
